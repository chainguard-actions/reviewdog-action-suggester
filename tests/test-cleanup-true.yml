name: Test cleanup=true drops stashed changes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create an uncommitted change to stash
        run: |
          echo "# test change" >> README.md
          git diff --stat
          echo "Uncommitted change created"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          tool_name: "test-suggester"
          level: "warning"
          filter_mode: "nofilter"
          fail_level: "none"
          cleanup: "true"
          # Override reporter to local so it works without a PR context
          reviewdog_flags: "-reporter=local"

      - name: Assert stashed changes were dropped (cleanup=true drops stash)
        run: |
          echo "Checking that stashed changes were dropped..."
          git status
          DIFF=$(git diff --stat)
          echo "diff stat: $DIFF"
          if [ -n "$DIFF" ]; then
            echo "FAIL: expected stash to be dropped but working tree has changes"
            exit 1
          fi
          echo "PASS: stash was dropped, working tree is clean"
