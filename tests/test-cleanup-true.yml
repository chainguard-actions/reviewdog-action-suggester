name: Test cleanup=true drops stash
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create an uncommitted change
        run: |
          echo "# test change" >> README.md
          git diff --stat
          echo "Uncommitted change created"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          tool_name: test-suggester
          level: warning
          filter_mode: nofilter
          fail_level: none
          cleanup: "true"
        continue-on-error: true

      - name: Assert stash was dropped (cleanup=true)
        run: |
          # With cleanup=true, the stash should be dropped
          # The working tree should be clean (no stash to pop)
          STASH_COUNT=$(git stash list | wc -l)
          echo "Stash count: $STASH_COUNT"
          if [ "$STASH_COUNT" -ne 0 ]; then
            echo "FAIL: expected stash to be dropped (cleanup=true), but stash count=$STASH_COUNT"
            exit 1
          fi
          echo "PASS: stash was dropped as expected"
