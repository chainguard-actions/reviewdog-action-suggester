name: Test fail_level input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure clean working tree
        run: |
          git status
          git diff --exit-code || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          tool_name: "test-fail-level"
          level: "warning"
          filter_mode: "nofilter"
          fail_level: "error"
          cleanup: "true"

      - name: Assert action ran with fail_level=error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=error and no diff, reviewdog should not fail on issues.
          # However, the github-pr-review reporter requires a real PR context.
          # Under the harness (sentinel repo, workflow_dispatch), it will fail
          # because there's no PR to post reviews to. That is expected.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with fail_level=error (no issues found)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / no PR context is expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
