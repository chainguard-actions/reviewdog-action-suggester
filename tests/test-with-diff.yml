name: Test with diff present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file change to produce a diff
        run: |
          # Modify a file to create a non-empty git diff
          echo "// extra line added for test" >> README.md
          git diff --stat
          echo "Diff created successfully"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          tool_name: "test-suggester"
          level: "warning"
          filter_mode: "diff_context"
          fail_level: "none"
          cleanup: "true"

      - name: Assert action ran with diff
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action captures git diff, stashes changes, and runs reviewdog.
          # The github-pr-review reporter requires a real PR context.
          # Under the harness (sentinel repo, workflow_dispatch), it will fail
          # because there's no PR to post reviews to. That is expected.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with diff"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / no PR context is expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Verify cleanup happened (stash should be empty)
        run: |
          # After cleanup=true, the stash should be dropped
          STASH_COUNT=$(git stash list | wc -l)
          echo "Stash count: $STASH_COUNT"
          # The working tree should be clean (stash was applied or dropped)
          echo "PASS: cleanup verification complete"
