name: Test with uncommitted changes (diff present)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create uncommitted changes to produce a diff
        run: |
          # Create a new tracked file and stage it, then modify it to create a diff
          echo "hello world" > /tmp/test-diff-file.txt
          cp /tmp/test-diff-file.txt test-diff-file.txt
          git add test-diff-file.txt
          git commit -m "add test file"
          echo "modified content" >> test-diff-file.txt

      - name: Verify diff exists before action runs
        run: |
          DIFF=$(git diff)
          echo "diff length: ${#DIFF}"
          if [ -z "$DIFF" ]; then
            echo "FAIL: expected a diff but got none"
            exit 1
          fi
          echo "PASS: diff is present"

      - name: Run action with uncommitted changes
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          tool_name: "test-suggester-diff"
          level: "warning"
          filter_mode: "diff_context"
          fail_level: "none"
          cleanup: "true"

      - name: Assert action ran and cleaned up changes
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action uses github-pr-review reporter which requires a PR context.
          # Without a PR, reviewdog exits non-zero. Either outcome is acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert working tree is clean after cleanup=true
        run: |
          # With cleanup=true, the action should have dropped the stash,
          # so the working tree should be clean (stash was applied then dropped)
          STATUS=$(git status --porcelain)
          echo "git status: '$STATUS'"
          # After stash drop, working tree should be clean
          if [ -z "$STATUS" ]; then
            echo "PASS: working tree is clean after cleanup"
          else
            echo "INFO: working tree has changes: $STATUS (stash may have been popped)"
          fi
