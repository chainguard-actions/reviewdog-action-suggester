name: Test path input with subdirectory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure git and modify fixture
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          sed -i 's/line two/line TWO changed/' tests/fixtures/sample/sample.txt
          git diff --quiet && { echo "FAIL: no diff produced"; exit 1; } || true
      - id: action
        uses: .
        with:
          path: tests/fixtures/sample
          cleanup: "false"
      - name: Assert action succeeded and change restored
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          cat tests/fixtures/sample/sample.txt
          if ! grep -q "line TWO changed" tests/fixtures/sample/sample.txt; then
            echo "FAIL: modification not restored with cleanup=false"
            exit 1
          fi
          echo "PASS"
