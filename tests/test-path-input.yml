name: Test path input - run in subdirectory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Ensure clean working tree
        run: |
          git status
          git diff --stat

      - name: Run action with path set to action subdirectory
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          path: "action"
          tool_name: "test-path-suggester"
          level: "warning"
          filter_mode: "nofilter"
          fail_level: "none"
          cleanup: "true"
        continue-on-error: true

      - name: Assert action ran in subdirectory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action should run in the 'action' subdirectory
          # With no diff and fail_level=none, it should succeed
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded when running in subdirectory"
          else
            echo "INFO: action outcome was '$OUTCOME' - may be expected outside PR context"
            echo "PASS: action ran with path input"
          fi
