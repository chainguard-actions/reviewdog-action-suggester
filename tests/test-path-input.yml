name: Test path input (run reviewdog in a subdirectory)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Run action with path set to a subdirectory
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          path: "action/testdata"
          tool_name: "test-suggester-path"
          level: "warning"
          filter_mode: "diff_context"
          fail_level: "none"
          cleanup: "true"

      - name: Assert action ran with path input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action uses github-pr-review reporter which requires a PR context.
          # Without a PR, reviewdog exits non-zero. Either outcome is acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with path input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
