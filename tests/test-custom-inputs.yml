name: Test custom inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/42/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: my-feature
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure clean working tree
        run: |
          git status
          git diff --stat

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          tool_name: my-custom-tool
          level: error
          filter_mode: added
          fail_level: none
          fail_on_error: "false"
          reviewdog_flags: ""
          cleanup: "true"

      - name: Assert action ran with custom inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should run (success or fail due to fake token/no real PR),
          # but must not be skipped or produce an unexpected state.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
