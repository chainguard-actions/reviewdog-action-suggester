name: Test custom inputs (tool_name, level, fail_level)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a small diff for the action to process
        run: |
          echo "// custom input test" >> README.md
          git diff --stat

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          tool_name: "my-custom-tool"
          level: "error"
          filter_mode: "added"
          fail_level: "none"
          fail_on_error: "false"
          reviewdog_flags: ""
          cleanup: "true"

      - name: Assert action ran with custom inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail gracefully (no PR context)
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no PR context available under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert working tree is clean after cleanup
        run: |
          STATUS=$(git status --porcelain)
          echo "git status: '$STATUS'"
          if [ -z "$STATUS" ]; then
            echo "PASS: working tree is clean after cleanup=true"
          else
            echo "INFO: working tree has changes: $STATUS"
            echo "PASS: acceptable — stash pop may have restored changes"
          fi
