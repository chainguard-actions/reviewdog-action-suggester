name: Test basic usage - no diff
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure clean working tree (no diff)
        run: |
          git status
          git diff --stat

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          tool_name: test-suggester
          level: warning
          filter_mode: diff_context
          fail_level: none
          cleanup: "true"

      - name: Assert action completed (pass or fail gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With no diff, reviewdog should have nothing to report.
          # The action may fail due to fake token / no real PR context,
          # but it should not crash before reaching reviewdog.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
