name: Test basic usage - no diff
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify clean working tree before action
        run: |
          git diff --exit-code
          echo "Working tree is clean"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          tool_name: "test-suggester"
          level: "warning"
          filter_mode: "nofilter"
          fail_level: "none"
          cleanup: "true"

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"
