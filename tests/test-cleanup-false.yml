name: Test cleanup=false pops stash (restores changes)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create an uncommitted change
        run: |
          echo "# test change for cleanup=false" >> README.md
          git diff --stat
          echo "Uncommitted change created"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          tool_name: test-suggester
          level: warning
          filter_mode: nofilter
          fail_level: none
          cleanup: "false"
        continue-on-error: true

      - name: Assert changes were restored (cleanup=false)
        run: |
          # With cleanup=false, the stash should be popped (changes restored)
          # The working tree should have the change back
          if git diff --exit-code -- README.md > /dev/null 2>&1; then
            echo "FAIL: expected changes to be restored (cleanup=false), but README.md has no diff"
            exit 1
          fi
          echo "PASS: changes were restored as expected (cleanup=false)"

      - name: Assert no stash remains
        run: |
          STASH_COUNT=$(git stash list | wc -l)
          echo "Stash count: $STASH_COUNT"
          if [ "$STASH_COUNT" -ne 0 ]; then
            echo "FAIL: expected stash to be empty after pop, but stash count=$STASH_COUNT"
            exit 1
          fi
          echo "PASS: stash is empty after pop"
