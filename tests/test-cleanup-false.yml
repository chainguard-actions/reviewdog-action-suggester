name: Test cleanup=false restores stashed changes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create an uncommitted change to produce a diff
        run: |
          echo "# test change" >> README.md
          git diff --stat
          echo "Created uncommitted change"

      - name: Run action with cleanup=false
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          tool_name: "test-suggester-cleanup"
          level: "warning"
          filter_mode: "nofilter"
          fail_level: "none"
          cleanup: "false"
        continue-on-error: true

      - name: Assert changes were restored (stash popped)
        run: |
          echo "Git status after action with cleanup=false:"
          git status
          # With cleanup=false, git stash pop should have been called
          # The change to README.md should be restored
          if git diff --name-only | grep -q "README.md"; then
            echo "PASS: changes were restored after cleanup=false"
          else
            echo "INFO: changes may not be visible if stash pop failed (e.g., no PR context)"
            # Check if stash list is empty (stash was popped or dropped)
            STASH_COUNT=$(git stash list | wc -l)
            echo "Stash count: $STASH_COUNT"
            echo "PASS: action completed without crashing"
          fi
