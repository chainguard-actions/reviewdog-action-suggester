name: Test cleanup=false - stash pop instead of drop
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git user for stash operations
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Set up fake curl on PATH
        run: |
          mkdir -p /tmp/fake-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-curl.sh" /tmp/fake-bin/curl
          chmod +x /tmp/fake-bin/curl
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - name: Create an uncommitted change to stash
        run: |
          echo "# test change" >> README.md

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          tool_name: "test-suggester"
          level: "info"
          filter_mode: "diff_context"
          fail_level: "none"
          fail_on_error: "false"
          cleanup: "false"

      - name: Assert stash was popped (change restored)
        run: |
          # With cleanup=false, git stash pop should restore the change
          if git diff --quiet HEAD; then
            echo "FAIL: expected uncommitted changes to be restored by stash pop"
            exit 1
          fi
          echo "PASS: uncommitted changes were restored (stash pop worked)"
