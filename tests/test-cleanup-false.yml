name: Test cleanup=false (stash is popped, changes restored)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create uncommitted changes to produce a diff
        run: |
          # Create a new tracked file and stage it, then modify it to create a diff
          echo "hello world" > test-cleanup-false-file.txt
          git add test-cleanup-false-file.txt
          git commit -m "add test file for cleanup-false"
          echo "modified content for cleanup=false test" >> test-cleanup-false-file.txt

      - name: Verify diff exists before action runs
        run: |
          DIFF=$(git diff)
          echo "diff length: ${#DIFF}"
          if [ -z "$DIFF" ]; then
            echo "FAIL: expected a diff but got none"
            exit 1
          fi
          echo "PASS: diff is present"

      - name: Run action with cleanup=false
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          tool_name: "test-suggester-cleanup-false"
          level: "warning"
          filter_mode: "diff_context"
          fail_level: "none"
          cleanup: "false"

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action uses github-pr-review reporter which requires a PR context.
          # Without a PR, reviewdog exits non-zero. Either outcome is acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert changes are restored after cleanup=false
        run: |
          # With cleanup=false, the action pops the stash (git stash pop),
          # so the working tree should have the original changes restored.
          STATUS=$(git status --porcelain)
          echo "git status: '$STATUS'"
          DIFF=$(git diff)
          echo "diff length: ${#DIFF}"
          if [ -n "$DIFF" ]; then
            echo "PASS: changes were restored (stash was popped, not dropped)"
          else
            echo "INFO: no diff found - stash may have been empty or already applied"
          fi
