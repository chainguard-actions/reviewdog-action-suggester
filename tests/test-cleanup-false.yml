name: Test cleanup=false restores stashed changes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create an uncommitted change to stash
        run: |
          echo "# test change" >> README.md
          git diff --stat
          echo "Uncommitted change created"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          tool_name: "test-suggester"
          level: "warning"
          filter_mode: "nofilter"
          fail_level: "none"
          cleanup: "false"
          # Override reporter to local so it works without a PR context
          reviewdog_flags: "-reporter=local"

      - name: Assert stashed changes were restored (cleanup=false pops stash)
        run: |
          echo "Checking if stashed changes were restored..."
          git status
          DIFF=$(git diff --stat)
          echo "diff stat: $DIFF"
          if [ -z "$DIFF" ]; then
            echo "FAIL: expected stashed changes to be restored but working tree is clean"
            exit 1
          fi
          echo "PASS: stashed changes were restored"
