name: Test custom path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a subdirectory to use as path
        run: |
          mkdir -p /tmp/test-subdir
          cd /tmp/test-subdir
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          touch placeholder.txt
          git add placeholder.txt
          git commit -m "init"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          path: /tmp/test-subdir
          tool_name: reviewdog-suggester
          level: warning
          filter_mode: diff_context
          fail_level: none
          cleanup: "true"

      - name: Assert action ran with custom path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should run in the specified path.
          # It may fail due to fake token / no real PR context,
          # but it should not be skipped or produce an unexpected state.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom path (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
