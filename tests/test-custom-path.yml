name: Test custom path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a subdirectory with a file change
        run: |
          mkdir -p tests/subdir
          echo "test content" > tests/subdir/testfile.txt
          git add tests/subdir/testfile.txt
          # Modify the file to create a diff (unstaged change)
          echo "modified content" >> tests/subdir/testfile.txt
          git diff --stat
          echo "Diff created in subdirectory"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          path: "tests/subdir"
          tool_name: "test-path-suggester"
          level: "warning"
          filter_mode: "diff_context"
          fail_level: "none"
          cleanup: "true"

      - name: Assert action ran with custom path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should cd into tests/subdir before running.
          # The github-pr-review reporter requires a real PR context.
          # Under the harness (sentinel repo, workflow_dispatch), it will fail
          # because there's no PR to post reviews to. That is expected.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom path"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / no PR context is expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
