name: Test basic usage with no diff
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure working tree is clean
        run: |
          git status
          # Make sure there are no uncommitted changes
          git diff --exit-code || (echo "Unexpected uncommitted changes" && exit 1)

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          tool_name: test-suggester
          level: warning
          filter_mode: nofilter
          fail_level: none
          cleanup: "true"
        continue-on-error: true

      - name: Assert action completed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With no diff, reviewdog should exit 0 (nothing to report)
          # The action may fail due to github-pr-review reporter needing real GitHub context
          # but we verify it at least ran (not a setup failure)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
