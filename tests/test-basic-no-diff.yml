name: Test basic usage with no diff
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Install fake reviewdog and mock curl
        run: |
          # Copy fake install script to /tmp for fake-curl to serve
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-install-reviewdog.sh" /tmp/fake-install-reviewdog.sh
          chmod +x /tmp/fake-install-reviewdog.sh

          # Create a directory in /tmp for fake binaries (no sudo needed)
          mkdir -p /tmp/fake-bin

          # Install fake reviewdog binary
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-reviewdog.sh" /tmp/fake-bin/reviewdog
          chmod +x /tmp/fake-bin/reviewdog

          # Install fake curl (intercepts reviewdog downloads)
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-curl.sh" /tmp/fake-bin/curl
          chmod +x /tmp/fake-bin/curl

          # Prepend /tmp/fake-bin to PATH for all subsequent steps
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

          # Also try to install to /usr/local/bin (may need sudo)
          sudo cp "$GITHUB_WORKSPACE/tests/fixtures/fake-reviewdog.sh" /usr/local/bin/reviewdog 2>/dev/null || true
          sudo chmod +x /usr/local/bin/reviewdog 2>/dev/null || true

          # Replace system curl with fake curl (save real curl first)
          if sudo test -x /usr/bin/curl 2>/dev/null && ! sudo test -x /usr/bin/curl.real 2>/dev/null; then
            sudo cp /usr/bin/curl /usr/bin/curl.real 2>/dev/null || true
          fi
          sudo cp "$GITHUB_WORKSPACE/tests/fixtures/fake-curl.sh" /usr/bin/curl 2>/dev/null || true
          sudo chmod +x /usr/bin/curl 2>/dev/null || true

          echo "Setup complete. PATH will include /tmp/fake-bin"

      - name: Ensure no uncommitted changes
        run: |
          git status
          echo "Working tree is clean, no diff expected"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          tool_name: "test-suggester"
          level: "warning"
          filter_mode: "diff_context"
          fail_level: "none"
          cleanup: "true"

      - name: Assert action ran (no diff case)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with no diff"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
