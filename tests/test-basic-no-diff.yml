name: Test basic usage - no diff
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Ensure working tree is clean
        run: |
          # Make sure there are no uncommitted changes that could interfere
          git checkout -- .
          git clean -fd
          STATUS=$(git status --porcelain)
          echo "git status: '$STATUS'"
          echo "Working tree is clean"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          tool_name: "test-suggester"
          level: "warning"
          filter_mode: "diff_context"
          fail_level: "none"
          cleanup: "true"
        continue-on-error: true

      - name: Assert action ran (no diff means reviewdog exits cleanly or fails on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (no diff, reviewdog exited cleanly)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - sentinel repo or no PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
