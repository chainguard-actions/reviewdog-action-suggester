name: Test fail_level=none always exits 0
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Ensure clean working tree
        run: |
          git status
          git diff --stat

      - name: Run action with fail_level=none and no diff
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          tool_name: "test-fail-level-none"
          level: "info"
          filter_mode: "nofilter"
          fail_level: "none"
          fail_on_error: "false"
          cleanup: "true"
        continue-on-error: true

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # With fail_level=none and no diff, action should succeed
          # (reviewdog exits 0 when there's nothing to report)
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with fail_level=none and no diff"
          else
            echo "INFO: action outcome was '$OUTCOME'"
            echo "PASS: action ran (non-PR context may cause reviewdog to exit non-zero)"
          fi
